[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "local-model-runtime-evaluation-harness"
# Single-sourced from the package so the two can never disagree; they were
# previously maintained separately in this file and __init__.py.
dynamic = ["version"]
description = "Fail-closed local model runtime evaluation orchestration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Randazza" }]
keywords = ["llm", "evaluation", "benchmark", "apple-silicon", "local-models"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Benchmark",
]

[project.urls]
Homepage = "https://github.com/JasonRandazza/local-model-runtime-evaluation-harness"
Changelog = "https://github.com/JasonRandazza/local-model-runtime-evaluation-harness/blob/main/CHANGELOG.md"
Issues = "https://github.com/JasonRandazza/local-model-runtime-evaluation-harness/issues"

[tool.hatch.version]
path = "src/local_model_runtime_evaluation/__init__.py"

[tool.pytest.ini_options]
# The suite imports both `local_model_runtime_evaluation` and `tests.*`, so it
# previously only ran where the package had been installed editable by hand.
# Declaring the paths lets a fresh checkout run pytest with no install step.
# The wheel itself is exercised separately by the install job in CI.
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"
exclude = ["graphify-out", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[dependency-groups]
dev = ["ruff==0.16.5", "pytest"]

[project.scripts]
lmre = "local_model_runtime_evaluation.managed_run_cli:main"
lmre-approach3 = "local_model_runtime_evaluation.approach3_cli:main"
lmre-discover = "local_model_runtime_evaluation.discovery_cli:main"
lmre-matrix = "local_model_runtime_evaluation.matrix_runner:main"
lmre-overhead = "local_model_runtime_evaluation.overhead_cli:main"
lmre-preference = "local_model_runtime_evaluation.preference_cli:main"
lmre-rag = "local_model_runtime_evaluation.rag_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_model_runtime_evaluation"]

# Ship the default operator trees as a workspace template inside the wheel.
#
# They are force-included from their canonical repository locations rather than
# moved into the package. Moving them would change the repo-relative input
# paths recorded in `input_hashes`, which is a comparison dimension -- runs
# planned before and after the move would read as INCOMPARABLE despite
# byte-identical configuration. `lmre init` copies this template into a new
# workspace, where the paths are `config/...` exactly as in a checkout.
[tool.hatch.build.targets.wheel.force-include]
"config" = "local_model_runtime_evaluation/_workspace_template/config"
"suites" = "local_model_runtime_evaluation/_workspace_template/suites"
"corpora" = "local_model_runtime_evaluation/_workspace_template/corpora"

[tool.hatch.build.targets.sdist]
include = [
  "src/local_model_runtime_evaluation",
  "bin",
  "config",
  "suites",
  "corpora",
  "tests",
  "docs",
  "schemas",
  "README.md",
  "AGENTS.md",
]
